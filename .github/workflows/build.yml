name: Build and Test

on:
  push:
    branches: [ main, develop ]


env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build with NUKE (GithubRelease)
      run: .\build.cmd GithubRelease
      shell: cmd

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET Tests
        path: .nuke/temp/w/Corney/test-result/*.trx
        reporter: dotnet-trx

    - name: Upload single-file executable
      uses: actions/upload-artifact@v4
      with:
        name: corney-executable-${{ github.sha }}
        path: .nuke/temp/w/Corney/github-release/Corney.exe
        retention-days: 7
