name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore src/Corney.sln

    - name: Build solution
      run: dotnet build src/Corney.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/Corney.Tests/Corney.Tests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory "TestResults" --collect:"XPlat Code Coverage"

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET Tests
        path: TestResults/*.trx
        reporter: dotnet-trx

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success() || failure()
      with:
        directory: TestResults
        flags: unittests
        name: codecov-umbrella

    - name: Build with NUKE (PublishSingleFile)
      run: .\build.cmd PublishSingleFile
      shell: cmd

    - name: Upload single-file executable
      uses: actions/upload-artifact@v4
      with:
        name: corney-executable-${{ github.sha }}
        path: dev/app.standalone/Corney.exe
        retention-days: 7

    - name: Build with NUKE (PublishLocal) 
      run: .\build.cmd PublishLocal
      shell: cmd

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: corney-build-${{ github.sha }}
        path: .nuke/temp/w/Corney/build/
        retention-days: 7