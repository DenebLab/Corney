name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore src/Corney.sln

    - name: Build solution
      run: dotnet build src/Corney.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/Corney.Tests/Corney.Tests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory "TestResults"

    - name: Test single-file build
      run: .\build.cmd PublishSingleFile
      shell: cmd

    - name: Verify executable
      run: |
        if (Test-Path "dev/app.standalone/Corney.exe") {
          $fileInfo = Get-Item "dev/app.standalone/Corney.exe"
          Write-Host "✅ Single-file executable created successfully"
          Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          Write-Host "   Path: $($fileInfo.FullName)"
        } else {
          Write-Error "❌ Single-file executable not found"
          exit 1
        }
      shell: pwsh

    - name: Comment PR
      uses: actions/github-script@v7
      if: success()
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Check if executable exists and get size
          const exePath = 'dev/app.standalone/Corney.exe';
          let comment = '✅ **PR Validation Passed**\n\n';
          
          if (fs.existsSync(exePath)) {
            const stats = fs.statSync(exePath);
            const sizeMB = (stats.size / (1024 * 1024)).toFixed(2);
            comment += `- Build successful\n- Tests passed\n- Single-file executable: ${sizeMB} MB\n`;
          } else {
            comment += '- Build successful\n- Tests passed\n- Single-file build verified\n';
          }
          
          comment += `\nCommit: ${context.sha.slice(0, 7)}`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });