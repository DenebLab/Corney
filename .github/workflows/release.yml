name: Release

on:
  push:
    branches:
      - production

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install AbcVersion tool
      run: dotnet tool install --global Deneblab.AbcVersionCmd
        
    - name: Get version
      id: version
      run: |
        VERSION=$(abcversion -p semversion)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-


    - name: Build with NUKE (GithubRelease)
      run: .\build.cmd GithubRelease
      shell: cmd



    - name: Prepare release assets
      run: |
        mkdir release-assets
        
        # Package build artifacts
        Compress-Archive -Path ".nuke/temp/w/Corney/github-release/*" -DestinationPath "release-assets/Corney-${{ steps.version.outputs.version }}-build.zip"
        
      shell: pwsh

    - name: Generate release notes
      id: release_notes
      run: |
        $notes = @"
        ## Corney v${{ steps.version.outputs.version }}
        
        ### What's New
        - Built from commit ${{ github.sha }}
        - .NET 9.0 single-file executable
        - Windows crontab file executor
        
        ### Downloads
        - **Corney-${{ steps.version.outputs.version }}-build.zip** - Full build artifacts
        
        ### System Requirements  
        - Windows 10/11
        - .NET 9.0 Runtime (for non-single-file builds)
        
        ### Usage
        Place your crontab files in the configured directory and run Corney.exe to start the scheduler.
        "@
        $notes | Out-File -FilePath release-notes.txt -Encoding utf8
        echo "RELEASE_NOTES_FILE=release-notes.txt" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Corney v${{ steps.version.outputs.version }}
        body_path: ${{ steps.release_notes.outputs.RELEASE_NOTES_FILE }}
        files: |
          release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true